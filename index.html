<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ARSII WebAR 3D Buttons</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.3.2/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin:0; overflow:hidden; }
  </style>
</head>
<body>

<a-scene embedded arjs="sourceType: webcam; detectionMode: mono_and_matrix;">

  <!-- ARSII logo marker -->
  <a-marker type="pattern" url="pattern-marker.patt">

    <!-- Particle effect -->
    <a-entity particle-system="preset: sparks; particleCount: 120; color: #00ff00, #ffff00, #ffffff; size: 0.05; velocitySpread: 1"></a-entity>

    <!-- Minecraft-style 3D buttons floating in semicircle -->
    <a-box id="instagram-btn" src="minecraft_block.png" depth="0.2" height="0.2" width="0.2" position="-0.4 0.3 0">
      <a-animation attribute="position" dur="1200" direction="alternate" repeat="indefinite" to="-0.4 0.35 0"></a-animation>
    </a-box>

    <a-box id="facebook-btn" src="minecraft_block.png" depth="0.2" height="0.2" width="0.2" position="0 0.3 0">
      <a-animation attribute="position" dur="1200" direction="alternate" repeat="indefinite" to="0 0.35 0"></a-animation>
    </a-box>

    <a-box id="discord-btn" src="minecraft_block.png" depth="0.2" height="0.2" width="0.2" position="0.4 0.3 0">
      <a-animation attribute="position" dur="1200" direction="alternate" repeat="indefinite" to="0.4 0.35 0"></a-animation>
    </a-box>

  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
  // Clickable 3D buttons
  document.addEventListener('DOMContentLoaded', () => {
    const instagram = document.querySelector('#instagram-btn');
    const facebook = document.querySelector('#facebook-btn');
    const discord = document.querySelector('#discord-btn');

    instagram.addEventListener('click', () => window.open('https://instagram.com/arsii_club','_blank'));
    facebook.addEventListener('click', () => window.open('https://facebook.com/arsii_club','_blank'));
    discord.addEventListener('click', () => window.open('https://discord.com/invite/arsii','_blank'));
  });
</script>

</body>
</html>
