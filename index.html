<html>
<head>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.3.2/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin:0; overflow:hidden;">
  <a-scene embedded arjs="sourceType: webcam; detectionMode: mono_and_matrix;">
    <a-assets>
      <a-asset-item id="steve" src="steve.glb"></a-asset-item>
    </a-assets>

    <!-- ARSII logo marker -->
    <a-marker type="pattern" url="pattern-marker.patt">
      <a-entity gltf-model="#steve" scale="0.5 0.5 0.5" animation-mixer></a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <div style="position:fixed;bottom:20px;width:100%;text-align:center;">
    <button onclick="window.open('https://instagram.com/arsii_club','_blank')">Follow ARSII</button>
  </div>
</body>
</html>
