<html>
  <head>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.3.2/aframe/build/aframe-ar.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
      #ui {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        z-index: 10;
      }
      button {
        background: #0078ff;
        color: white;
        padding: 12px 20px;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
      }
      button:hover { background: #005fbb; }
    </style>
  </head>

  <body>
    <a-scene embedded arjs="sourceType: webcam; detectionMode: mono_and_matrix;">
      <a-assets>
        <a-asset-item id="steve" src="steve.glb"></a-asset-item>
      </a-assets>

      <!-- ARSII logo marker -->
      <a-marker type="pattern" url="pattern-marker.patt">
        <a-entity
          gltf-model="#steve"
          scale="0.5 0.5 0.5"
          rotation="0 180 0"
          position="0 0 0"
          animation-mixer>
        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <div id="ui">
      <button onclick="window.open('https://www.instagram.com/arsii_club', '_blank')">
        Follow ARSII on Instagram
      </button>
    </div>
  </body>
</html>
